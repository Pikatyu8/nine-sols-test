<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Sols — Character Resonance Test</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Шрифт Lexend Deca -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #091F26;
            --color-text: #EAD69C;
            --color-accent: #69A38C;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Lexend Deca', sans-serif;
            background-image: linear-gradient(rgba(9, 31, 38, 0.90), rgba(9, 31, 38, 0.96)), url('https://ninesols.wiki.gg/images/New_Game_BG.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #051318;
        }
        ::-webkit-scrollbar-thumb {
            background: #69A38C;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 relative">

    <!-- Переключатель языков -->
    <div class="absolute top-4 right-4 flex space-x-2 z-50">
        <button onclick="setLanguage('en')" id="lang-btn-en" class="flex items-center space-x-1.5 px-3 py-1.5 rounded border border-[#69A38C]/40 bg-[#091F26]/90 text-xs font-semibold transition-all duration-200">
            <span>🇺🇸</span> <span>EN</span>
        </button>
        <button onclick="setLanguage('ru')" id="lang-btn-ru" class="flex items-center space-x-1.5 px-3 py-1.5 rounded border border-[#69A38C]/40 bg-[#091F26]/90 text-xs font-semibold transition-all duration-200">
            <span>🇷🇺</span> <span>RU</span>
        </button>
    </div>

    <!-- Заголовок -->
    <header class="w-full max-w-4xl text-center my-4 border-b border-[#69A38C]/30 pb-4">
        <h1 class="text-3xl md:text-5xl font-black mb-2 tracking-widest text-[#EAD69C] drop-shadow-[0_2px_8px_rgba(234,214,156,0.25)]">
            NINE SOLS
        </h1>
    </header>

    <!-- Основное окно -->
    <main class="w-full max-w-3xl flex-grow flex items-center justify-center my-6">
        
        <!-- ЭКРАН 1: Приветствие -->
        <div id="start-screen" class="bg-[#091F26]/95 border-2 border-[#69A38C]/40 p-6 md:p-10 rounded-lg shadow-2xl text-center w-full max-w-2xl backdrop-blur-md transition-all duration-300">
            <h2 id="start-title" class="text-2xl md:text-3xl font-bold mb-6 text-[#EAD69C]"></h2>
            <p id="start-desc" class="text-sm md:text-base leading-relaxed mb-8 text-gray-300"></p>
            <button onclick="startQuiz()" id="start-btn" class="px-8 py-4 bg-[#69A38C] text-[#091F26] font-bold text-lg rounded uppercase tracking-wider hover:bg-[#EAD69C] hover:scale-105 transition-all duration-300 shadow-[0_0_15px_rgba(105,163,140,0.3)]">
            </button>
        </div>

        <!-- ЭКРАН 2: Опрос -->
        <div id="quiz-screen" class="hidden bg-[#091F26]/95 border-2 border-[#69A38C]/40 p-6 md:p-8 rounded-lg shadow-2xl w-full backdrop-blur-md transition-all duration-300">
            <div class="flex justify-between items-center mb-4 text-xs md:text-sm text-[#69A38C]">
                <span id="question-number" class="font-semibold uppercase tracking-wider"></span>
                <span id="progress-percent" class="font-semibold text-[#EAD69C]"></span>
            </div>
            <!-- Прогресс-бар -->
            <div class="w-full bg-black/50 h-2 rounded-full mb-8 overflow-hidden border border-[#69A38C]/20">
                <div id="progress-bar" class="bg-[#69A38C] h-full transition-all duration-300"></div>
            </div>

            <!-- Поле вопроса -->
            <div class="min-h-[140px] flex items-center justify-center mb-8">
                <p id="question-text" class="text-lg md:text-xl text-center font-medium leading-relaxed italic text-[#EAD69C]">
                </p>
            </div>

            <!-- Варианты ответа -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <button onclick="handleAnswer(-1)" id="btn-disagree" class="py-4 px-6 border border-red-900/40 bg-red-950/10 text-red-300 rounded hover:bg-red-900/35 hover:border-red-500 hover:text-white transition-all duration-200 font-bold text-sm uppercase tracking-wider">
                </button>
                <button onclick="handleAnswer(0)" id="btn-neutral" class="py-4 px-6 border border-gray-600/40 bg-gray-800/10 text-gray-300 rounded hover:bg-gray-700/35 hover:border-gray-400 hover:text-white transition-all duration-200 font-bold text-sm uppercase tracking-wider">
                </button>
                <button onclick="handleAnswer(1)" id="btn-agree" class="py-4 px-6 border border-[#69A38C]/30 bg-[#69A38C]/5 text-[#69A38C] rounded hover:bg-[#69A38C] hover:text-[#091F26] transition-all duration-200 font-bold text-sm uppercase tracking-wider">
                </button>
            </div>

            <!-- Навигация -->
            <div class="flex justify-between border-t border-[#69A38C]/20 pt-4">
                <button id="back-btn" onclick="prevQuestion()" class="px-4 py-2 text-sm text-gray-400 hover:text-[#EAD69C] disabled:opacity-30 disabled:pointer-events-none transition-colors">
                </button>
                <button id="reset-btn" onclick="confirmReset()" class="px-4 py-2 text-sm text-red-400 hover:text-red-300 transition-colors">
                </button>
            </div>
        </div>

        <!-- ЭКРАН 3: Результаты -->
        <div id="results-screen" class="hidden bg-[#091F26]/95 border-2 border-[#69A38C]/40 p-6 md:p-8 rounded-lg shadow-2xl w-full backdrop-blur-md transition-all duration-300">
            <h2 id="results-title" class="text-2xl md:text-3xl font-extrabold text-center mb-6 text-[#69A38C] border-b border-[#69A38C]/20 pb-4 uppercase tracking-widest">
            </h2>

            <!-- Победитель -->
            <div class="flex flex-col md:flex-row items-center md:items-start gap-6 mb-8 bg-black/30 p-5 rounded-lg border border-[#69A38C]/20">
                <div class="w-40 h-40 md:w-48 md:h-48 shrink-0 rounded-lg overflow-hidden border-2 border-[#EAD69C] bg-black/40 flex items-center justify-center">
                    <img id="winner-image" src="" alt="Winner" class="w-full h-full object-cover">
                </div>
                <div class="flex-grow text-center md:text-left">
                    <span id="winner-subtitle-label" class="text-xs font-bold tracking-widest text-[#69A38C] uppercase"></span>
                    <h3 id="winner-name" class="text-2xl md:text-3xl font-black text-[#EAD69C] mt-1 mb-3"></h3>
                    <p id="winner-desc" class="text-xs md:text-sm leading-relaxed text-gray-300"></p>
                </div>
            </div>

            <!-- Спектр Дао (Аккордеон) -->
            <div class="mb-6">
                <div class="flex flex-col sm:flex-row justify-between items-baseline mb-3">
                    <h4 id="chart-title" class="text-base font-extrabold text-[#EAD69C] tracking-wide uppercase"></h4>
                    <span id="chart-tip" class="text-[10px] text-gray-400 italic"></span>
                </div>
                <div id="scores-chart" class="space-y-2 max-h-[320px] overflow-y-auto pr-2">
                    <!-- Заполняется динамически -->
                </div>
            </div>

            <div class="flex justify-center pt-4 border-t border-[#69A38C]/20">
                <button onclick="restartQuiz()" id="restart-btn" class="px-8 py-3 bg-[#69A38C] text-[#091F26] font-bold rounded uppercase tracking-wider hover:bg-[#EAD69C] transition-all duration-300">
                </button>
            </div>
        </div>

    </main>

    <!-- Подвал -->
    <footer class="w-full text-center py-4 text-[10px] text-gray-500 mt-4">
        Nine Sols Fan Project. All character portraits and background assets are property of Red Candle Games.
    </footer>

            currentQuestionIndex = 0;
            userAnswers = [];
            showQuestion();

        function showQuestion() {
            const totalQuestions = shuffledQuestionIds.length;
            const currentNumber = currentQuestionIndex + 1;
            const progress = (currentQuestionIndex / totalQuestions) * 100;

            const progressText = i18n[currentLanguage].questionNo
                .replace('{current}', currentNumber)
                .replace('{total}', totalQuestions);

            questionNumberText.innerText = progressText;
            progressPercentText.innerText = `${Math.round((currentQuestionIndex / totalQuestions) * 100)}%`;
            progressBar.style.width = `${progress || 2}%`;
            
            const currentQuestionId = shuffledQuestionIds[currentQuestionIndex];
            questionText.innerText = questions[currentQuestionId][currentLanguage];

            backBtn.disabled = currentQuestionIndex === 0;
        }

        function handleAnswer(value) {
            const currentQuestionId = shuffledQuestionIds[currentQuestionIndex];
            userAnswers = userAnswers.filter(ans => ans.questionId !== currentQuestionId);
            userAnswers.push({ questionId: currentQuestionId, value: value });

            if (currentQuestionIndex < shuffledQuestionIds.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

                    <button onclick="toggleAccordion('${solKey}')" class="w-full text-left p-3 focus:outline-none flex flex-col space-y-1.5">
                        <div class="flex justify-between items-center text-xs md:text-sm font-bold">
                            <span class="${solKey === winnerKey ? 'text-[#EAD69C]' : 'text-[#69A38C]'} flex items-center gap-1.5">
                                ${solData.name[currentLanguage]} 
                                <span class="text-[10px] text-gray-500 font-normal">▼</span>
                            </span>
                            <span class="font-mono text-[#EAD69C]">${percentage}%</span>
                        </div>
                        <div class="w-full bg-black/50 h-2 rounded-full overflow-hidden border border-[#69A38C]/10">
                            <div class="h-full rounded-full transition-all duration-1000 ${solKey === winnerKey ? 'bg-[#EAD69C]' : 'bg-[#69A38C]/60'}" style="width: ${percentage}%"></div>
                        </div>
                    </button>
                    <div id="accordion-${solKey}" class="hidden p-4 bg-black/30 border-t border-[#69A38C]/10 flex flex-col md:flex-row gap-4 items-center md:items-start transition-all">
                        <img src="${solData.img}" class="w-20 h-20 rounded-md border border-[#69A38C]/30 object-cover ${solData.imgPos || 'object-center'} shrink-0" alt="">
                        <div>
                            <p class="text-[11px] md:text-xs text-gray-300 leading-relaxed">${solData.desc[currentLanguage]}</p>
                        </div>
                    </div>
                `;
                scoresChart.appendChild(solItem);
            });
        }

        function toggleAccordion(solKey) {
            const accordion = document.getElementById(`accordion-${solKey}`);
            if (accordion.classList.contains('hidden')) {
                accordion.classList.remove('hidden');
            } else {
                accordion.classList.add('hidden');
            }
        }

        function calculateResults(answers) {
            let rawScores = { Yi: 0, Kuafu: 0, Goumang: 0, Yanlao: 0, Jiequan: 0, LadyEthereal: 0, Fuxi: 0, Nuwa: 0, Ji: 0, Eigong: 0 };

            answers.forEach(ans => {
                let impact = questions[ans.questionId].impact;
                for (let sol in impact) {
                    if (rawScores.hasOwnProperty(sol)) {
                        rawScores[sol] += ans.value * impact[sol];
                    }
                }
            });

            let normalizedScores = {};
            for (let sol in rawScores) {
                normalizedScores[sol] = rawScores[sol] / maxScores[sol];
            }

            let winnerKey = Object.keys(normalizedScores).reduce((a, b) => normalizedScores[a] > normalizedScores[b] ? a : b);
            let maxNormalized = normalizedScores[winnerKey];
            let maxPercentage = Math.round((maxNormalized + 1) * 50);

            // Порог: строго более 50% (хотя бы 51%)
            let finalWinner = winnerKey;
            if (maxPercentage < 51) {
                finalWinner = "Nobody";
            }

            return { winner: finalWinner, scores: normalizedScores };
        }

        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
